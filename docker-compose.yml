services:
  postgres:
    image: postgres:17-alpine
    container_name: balaio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: balaio
      POSTGRES_PASSWORD: balaio
      POSTGRES_DB: balaio
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balaio -d balaio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
